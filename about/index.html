</svg> </button> </div> </div> <div id="mobile-menu" class="hidden md:hidden bg-[#172743]/98 border-t border-white/5"> <nav class="px-4 pt-3 pb-4 space-y-1"> <a href="/about" class="nav-link block rounded-sm px-2 py-2.5" data-lang-key="navAbout">Über AGT</a> <a href="/president-message" class="nav-link block rounded-sm px-2 py-2.5" data-lang-key="navPresidentMessage">Grußwort</a> <a href="/#theme" class="nav-link block rounded-sm px-2 py-2.5" data-lang-key="navTheme">Themenbeschreibung</a> <a href="/#informationen" class="nav-link block rounded-sm px-2 py-2.5" data-lang-key="navInfo">Informationen</a> <a href="/#contact" class="nav-link block rounded-sm px-2 py-2.5" data-lang-key="navContact">Kontakt</a> </nav> <div class="lang-switcher text-center border-t border-white/10 py-4"> <button type="button" id="lang-de-mobile" data-lang="de" class="p-1" data-lang-key="languageGerman">Deutsch</button> <span class="text-slate-500">|</span> <button type="button" id="lang-en-mobile" data-lang="en" class="p-1" data-lang-key="languageEnglish">Englisch</button> </div> </div> </header> <main class="relative z-30 py-20 md:py-24"> <section id="about" class="container mx-auto px-6"> <h2 class="text-4xl md:text-5xl font-extrabold text-center mb-12 md:mb-16" data-lang-key="aboutTitle">Über AGT</h2> <div class="max-w-4xl mx-auto text-slate-300 text-lg leading-relaxed space-y-6"> <p data-lang-key="aboutP1"></p> <p data-lang-key="aboutP2"></p> <ul class="list-disc list-inside space-y-2 pl-4" data-lang-key-list="aboutConferenceList"></ul> <p data-lang-key="aboutP3"></p> <p data-lang-key="aboutP4"></p> </div> </section> </main> <footer class="bg-black py-8"> <div class="container mx-auto px-6 text-center text-slate-500"> <p data-lang-key="footerCopyright">&copy; 2027 Asiatische Germanistentagung Organizing Committee. All Rights Reserved.</p> </div> </footer>  <script type="module" src="/_astro/Layout.astro_astro_type_script_index_0_lang.CqqxX0ba.js"></script> <script>(function(){const content = {"de":{"headerTitle":"AGT  2027","navAbout":"Über die AGT","navPresidentMessage":"Grußwort","navTheme":"Generalthema","navInfo":"Informationen","navContact":"Kontakt","languageGerman":"Deutsch","languageEnglish":"Englisch","heroTitle":"Asiatische Germanistentagung 2027","heroSubtitle":"23. - 26. August 2027 | Incheon, Südkorea","heroHostedBy":"Gastgeber: INU","informationenTitle":"Informationen","infoCardAnmeldung":"Anmeldung","infoCardProgramm":"Programm und Sektionen","infoCardTagungsort":"Tagungsort","infoCardRahmenprogramm":"Rahmenprogramm","subInfoAnreise":"Anreise und Unterkunft","subInfoLesungen":"Autorenlesungen","subInfoFoerdergeber":"Förderer","themeLabel":"Generalthema","themeTitle":"Nutzen und Nachteil der Germanistik in Asien für die Gegenwart","themeShortDesc":"In Asien – mit Sicherheit aber zumindest in Korea – ist, heutzutage Germanist zu sein,\n      allem Anschein nach ein Nachteil. Das hat zum einen mit der zunehmenden\n      Marginalisierung des Deutschen zu tun. So ist nicht nur das Englische übermächtig,\n      sondern auch als zweite Fremdsprache in Schulen befindet sich Deutsch quantitativ im\n      Rückgang. Aber auch das Sprachen-Lernen selbst hat an Bedeutung eingebüßt: Wozu\n      soll man noch (und dazu ausgerechnet) Deutsch lernen, wenn sich alles durch mehr als\n      kompetente Übersetzungs-Apps im Handumdrehen übersetzen lässt?","themeFullDesc1":"Was die deutsche\n        Literatur betrifft, verschärft sich die Situation noch mehr. Gegenüber den digitalen\n        Medien ist das Medium Buch besonders für die jüngeren Generationen immer weniger\n        attraktiv. Und außerdem: Wozu soll man Goethe, Musil oder Kafka lesen, wenn wir\n        Asiaten selbst ‚Hochliteratur‘, wie z. B. Mo Yan, den Nobelpreisträger für Literatur im Jahr\n        2012, oder Han Kang, die Nobelpreisträgerin 2024, hervorbringen, ganz zu schweigen\n        von der ‚Welteroberung‘ durch populärkulturelle ‚K-Contents’. Dementsprechend\n        geraten (wenigstens hier in Korea) die Abteilungen für Deutsche Sprache und Literatur\n        immer mehr ins Hintertreffen. Es werden die Studienplätze und Lehrstühle reduziert, um\n        die digitalen und technischen Studiengänge auszuweiten. Germanistik ist unter der\n        digitaltechnischen Vorherrschaft immer stärker ‚unzeitgemäß‘ geworden und befindet\n        sich in der Krise.","themeFullDesc2":"Trotzdem hat, in Asien Germanist zu sein, sehr wohl einen Nutzen, was paradoxerweise\n        gerade mit diesem Zeitgeist, der die Germanistik marginalisiert, zu tun hat. Nämlich: Die\n        für die Technik begeisterte Zeit selbst befindet sich in der Krise, welche sich mit den\n        großen ‚K‘s – Krieg, KI (künstliche Intelligenz) und Klimawandel – umschreiben lässt.\n        Um die einzelnen Probleme, die mit diesen drei großen ‚K’s zusammenhängen, zu\n        nennen: aus politischer und sozialer Hinsicht Nationalismus, Flüchtlingskrise, Trauma,\n        Erinnerungskultur und die Identitätsfragen; aus ökonomischer Hinsicht die Digitalisierung,\n        die Techno-Utopien des Transhumanen, die mit der KI zusammenhängen; schließlich aus\n        ökologischer Hinsicht das Artensterben, Nachhaltigkeit, Klimawandel. Die Germanistik\n        (Inlands- sowie Auslandsgermanistik) hat immer versucht, sich den Herausforderungen,\n        die die komplexen Probleme der Gesellschaft stellen, gewachsen zu zeigen, wie auch das\n        Generalthema des Kongresses der IVG (Internationale Vereinigung für Germanistik) 2025\n        in Graz zeigt: Sprache und Literatur in Krisenzeiten – Herausforderungen, Aufgaben und\n        Chancen der internationalen Germanistik. Und hier liegt unser Nutzen in dieser an dem\n        Technik-Fieber leidenden Zeit. Denn Sprache und Literatur sind die Reflexionsfläche für\n        die Probleme der Gegenwart. So führt die neue digitale Technik auch in der Sprache und\n        Literatur zu einer ‚digitalen Wende‘. Beispiele sind die digitale Literatur, also durch KI\n        generierte oder auf Twitter veröffentliche Gedichte. Oder die Einbeziehung von KI in den\n        Sprachunterricht. Sprache und Literatur sind der Aushandlungs- und Handlungsort dieser\n        Probleme, wie z. B. Climate Fiction auf die Klima-Krise reagiert, indem sie die Wirklichkeit\n        konfiguriert und den Leser zur Refiguration der Wirklichkeit motiviert.","themeFullDesc3":"Und gerade die Asiatische (bzw. Auslands-)Germanistik hat ihre Chance in dieser\n        Krisenzeit. Denn einerseits ist der Siegeszug der digitalen Technik hier rasanter und\n        umfangreicher als in Europa zu spüren. Andererseits kann die asiatische Germanistik,\n        abseits der nationalphilologischen Aufgaben stehend, mehr auf die interkulturellen,\n        internationalen und transnationalen Aspekte der Sprache und Literatur gerichtet sein. Die\n        Probleme, die die jetzigen Krisenzeiten bestimmen, sind nur durch inter- oder\n        transkulturelle und transnationale Kommunikation und Zusammenarbeit zu lösen.","themeFullDesc4":"Daher möchten wir, die asiatischen Germanisten, gerne ‚unzeitgemäß‘ bleiben, in dem\n        Sinne, dass wir „gegen die Zeit und dadurch auf die Zeit und hoffentlich zugunsten einer\n        kommenden Zukunft […] wirken“, worin Nietzsche als klassischer Philologe seine\n        Existenzberechtigung gesehen hat.","themeBtnReadMore":"Mehr erfahren","themeBtnShowLess":"Weniger anzeigen","aboutTitle":"Über die AGT","aboutP1":"Die Asiatische Germanistentagung wurde, auch wenn sie sich damals noch nicht so genannt hat, im August 1991 begründet, als die Japanische Gesellschaft für Germanistik für die drei ostasiatischen Länder Japan, China und Korea ein Symposium in Berlin zum Thema ‚Deutsche Literatur und Sprache aus ostasiatischer Perspektive’ veranstaltete.","aboutP2":"Mit diesem Symposium war der Grundstein für eine internationale Germanistenkonferenz in und für Asien gelegt, die gemäß späteren Vereinbarungen prinzipiell alle drei Jahre wechselweise in einem der drei Länder stattfinden sollte. In diesem Rahmen wurde die Regionaltagung des Internationalen Deutschlehrer und –lehrerinnen Verbandes (IDV) 1994 in Beijing als die erste bzw. faktisch zweite Asiatische Germanistentagung durchgeführt, gefolgt von weiteren Konferenzen:","aboutConferenceList":["1997 (Seoul): Germanistik im multimedialen Zeitalter","1999 (Fukuoka): Schwellenüberschreitungen","2002 (Beijing): Neues Jahrhundert, neue Herausforderungen","2006 (Seoul): Kulturwissenschaftliche Germanistik in Asien","2008 (Kanazawa): Transkulturalität: Identitäten in neuem Licht","2012 (Beijing): Interlingualität, Interkulturalität, Interdisziplinarität: Grenzerweiterungen der Germanistik","2016 (Seoul): Germanistik in Zeiten des großen Wandels – Tradition, Identität, Orientierung","2019 (Sapporo): Einheit in der Vielfalt? Germanistik zwischen Divergenz und Konvergenz","2024 (Qingdao): Technik · Gesellschaft · Kultur – Herausforderungen und Chancen für die Germanistik heute"],"aboutP3":"Wenn es 1991 in Berlin eine asiatische Perspektive herauszustellen galt, so war damit die zentrale Problematik der Auslandsgermanistik in Asien angedeutet, die sich ihrer Identität wie ihrer Betätigungsfelder bewusst werden und für sie kämpfen musste. Wie aus den oben genannten Tagungsthemen ersichtlich wird, ging es auf den weiteren Tagungen stets um Themen, die die jüngsten internationalen Entwicklungen der Germanistik mitbestimmten und zugleich unserem Bedürfnis nach einer Neuorientierung in Lehre und Forschung Rechnung trugen.","aboutP4":"Es gehört auch zu den Gepflogenheiten der Asiatischen Germanistentagung, neben den Mitgliedern der chinesischen, koreanischen und japanischen Fachverbände, Wissenschaftler und Wissenschaftlerinnen weltweit, vor allem aus anderen asiatischen Ländern wie auch aus Deutschland, Österreich und der Schweiz, einzuladen.","presidentMessageTitle":"Grußwort","presidentName":"Prof. Dr. KANG Chang-Uh","presidentDesc1":"Sehr geehrte Kolleginnen und Kollegen,","presidentDesc2":"es ist für mich eine große Freude, Sie im Namen der Koreanischen Gesellschaft für Germanistik (= KGG) über\n      die nächste Asiatische Germanisten-Tagung (= AGT) informieren zu dürfen. Sie findet vom 23. bis zum 26.\n      August 2027 an der Incheon National University in Incheon, Südkorea, statt, und zwar unter dem Generalthema\n      „Nutzen und Nachteil der Germanistik in Asien für die Gegenwart“.","presidentDesc3":"In den letzten Jahrzehnten war die\n      Germanistik in Asien mit verschiedenen Herausforderungen konfrontiert, und wir, die asiatischen Germanisten,\n      haben uns erfolgreich bemüht, gemeinsam einen Weg bzw. Ausweg zu erarbeiten, wozu m. E. die Asiatischen\n      Germanisten-Tagungen seit den 1990er Jahren viel beigetragen haben. Im Anschluss an die Erfolge in Sapporo\n      2019 und in Qingdao 2024 wollen wir diese lange Tradition diesmal im Jahr 2027 in Korea fortführen.","presidentDesc4":"Ich hoffe\n      sehr, dass möglichst viele Germanistinnen und Germanisten nicht nur aus China, Japan und Südkorea, sondern\n      auch aus aller Welt in Incheon zusammenkommen, um Informationen und Meinungen auszutauschen und\n      gemeinsam neue Wege für die Germanistik in Asien im gerade begonnenen Zeitalter der Künstlichen Intelligenz\n      zu erkunden. Das Organisationskomitee der AGT 2027 unter der Leitung von Frau Professor SHIN Jiyoung\n      wird zusammen mit der KGG sein Bestes geben, um die Tagung bereichernd zu gestalten und den Aufenthalt in\n      Incheon angenehm zu machen. Ich freue mich schon auf die AGT 2027 in Incheon.","presidentTitleName":"Präsident","presidentTitleOrg":"der Koreanischen Gesellschaft für Germanistik","registerTitle":"Anmeldung","registerType1Title":"1. Sektionsleitung","sectionLeaderClosedNotice":"Die Bewerbungsphase für die Sektionsleitung ist abgeschlossen.","sectionLeaderProgramNotice":"Informationen zu den angenommenen Sektionen finden Sie unter Informationen - Programm und Sektionen.","registerType1Btn":"Programm und Sektionen","registerType2Title":"2. Vortragende","registerType2Deadline":"Bewerbungsfrist: Mai - Dez. 2026","registerType2Desc":"Präsentieren Sie Ihre Forschungsergebnisse einem internationalen Publikum.","presentationNoticeTitle":"Hinweis zur Vortragseinreichung","presentationSectionLeaderContactNotice":"Bei Fragen wenden Sie sich bitte direkt per E-Mail an die jeweilige Sektionsleitung.","presentationSectionRequirement":"Bitte geben Sie im Formular unbedingt an, in welcher Sektion Sie vortragen möchten.","presentationSameAsSectionNotice":"Die weiteren Angaben orientieren sich am Formular für die Sektionsleitung.","registerType2Btn":"Formular (Vortrag)","registerType3Title":"3. Teilnehmende","registerType3Deadline":"Anmeldung: ab Mai 2026","registerType3Desc":"Nehmen Sie an den Diskussionen teil und vernetzen Sie sich mit Kollegen.","registerType3Btn":"Formular (Teilnahme)","registerNote":"* Sektionsleiter und Vortragende müssen sich ebenfalls als Teilnehmende registrieren.","registrationCommonNotice":"Alle Anmeldeformulare (Sektion, Vortrag, Teilnahme) enthalten auch die Anmeldung für das Rahmenprogramm.","paymentCompletionNotice":"Die Anmeldung ist erst nach Eingang der Teilnahmegebühr (ggf. inkl. der Gebühr für das Rahmenprogramm) abgeschlossen.","feeDetailsTitle":"Teilnahmegebühren","feeFullTime":"Vollzeit/Teilzeit: 150.000 KRW","feeStudent":"Studierende: 50.000 KRW","bankInfoTitle":"Bankverbindung","bankTransferTitle":"Überweisung / Bank Transfer","bankDetails":"Kookmin Bank (KB): 098001-00-005911","bankAccountHolder":"(name: KGG)","internationalBankInfo":["Bank: KOOKMIN BANK","Address: 26, Gukjegeumyung-ro 8-gil, Yeongdeungpo-gu, Seoul, Korea","Swift Code: CZNBKRSEXXX","Account Number: 098001-00-005911","Name: KGG","Phone: 028874274"],"googleFormNoticeTitle":"Wichtiger Hinweis: Online-Anmeldeformulare (Google Forms)","googleFormNoticeBody":"Alle oben genannten \"Formular\"-Buttons leiten zu Google Forms w heduleDesc":"Morgen- und Abendverbindungen werden semesterweise bekannt gegeben.","venueConferencePeriodLabel":"Konferenzzeitraum:","venueConferencePeriodDesc":"Prüfen Sie vor der Anreise den endgültigen Tagungsleitfaden.","venueRealtimeAppsLabel":"Echtzeit-Apps:","venueRealtimeAppsDesc":"KakaoMap oder Naver Map werden empfohlen.","arrivalAccommodationDesc1":"Informationen zur Anreise zum Konferenzort und zu Unterkunftsmöglichkeiten in Incheon werden hier in Kürze zur Verfügung gestellt.","arrivalAccommodationDesc2":"Wir werden Empfehlungen für Hotels in verschiedenen Preiskategorien sowie Informationen zur Nutzung des öffentlichen Nahverkehrs bereitstellen.","sponsorsDesc1":"Wir danken unseren Fördergebern und Sponsoren für ihre großzügige Unterstützung.","sponsorsDesc2":"Eine Liste unserer Partner wird hier in Kürze veröffentlicht.","readingsDesc1":"Im Rahmen der Konferenz werden Autorenlesungen stattfinden. Details zu den Autoren und die genauen Termine werden hier bekannt gegeben.","readingsDesc2":"Freuen Sie sich auf spannende Einblicke in die zeitgenössische deutschsprachige Literatur.","teamTitle":"AGT-Organisationsteam","teamMembers":[{"name":"Prof. Dr. phil. KANG, Chang-Uh","role":"KGG-Präsident (2025-2026)","institution":"Seoul National University, Seoul"},{"name":"Prof. Dr. phil. SHIN, Jiyoung","role":"AGT-Organisationsleitung","institution":"Korea University, Seoul"},{"name":"Assoz. Prof. Dr. phil. MOK, Seong-Sook","role":"AGT-Organisation (vor Ort)","institution":"Incheon National University, Incheon"},{"name":"Assist. Prof. Dr. phil. CHOI, Garam","role":"Schatzmeisterin","institution":"Pusan National University, Pusan"},{"name":"Prof. Dr. phil. KIM, Yeon Soo","role":"Programm und Sektionen (Literatur)","institution":"Kangwon National University, Chuncheon"},{"name":"Assoz. Prof. Dr. phil. KIM, Kyong","role":"Programm und Sektionen (Sprache)","institution":"Pusan National University, Pusan"},{"name":"Assist. Prof. Dr. phil. CHO, Hyowon","role":"Homepage und Presse","institution":"Yonsei University, Seoul"},{"name":"Prof. Dr. phil. Christian Baier","role":"Begleitheft und Tagungsband","institution":"Seoul National University, Seoul"}],"contactTitle":"Kontakt","contactDesc":"Für alle Anfragen zur Konferenz wenden Sie sich bitte an die folgende E-Mail-Adresse.","contactEmail":"agt2027.incheon@gmail.com","contactAssistant":"GWON, Minseo B. A. (Korea University), Assistentin für die Organisation","footerCopyright":"© 2027 Asiatische Germanistentagung Organizing Committee. All Rights Reserved."},"en":{"headerTitle":"AGT  2027","navAbout":"About AGT","navTheme":"Main Theme","navPresidentMessage":"Greetings","navInfo":"Information","navContact":"Contact","languageGerman":"German","languageEnglish":"English","heroTitle":"Asian German Studies Conference 2027","heroSubtitle":"August 23 - 26, 2027 | Incheon, South Korea","heroHostedBy":"Hosted by INU","informationenTitle":"Information","infoCardAnmeldung":"Registration","infoCardProgramm":"Program and Sections","infoCardTagungsort":"Venue","infoCardRahmenprogramm":"Social Program","subInfoAnreise":"Arrival and Accommodation","subInfoLesungen":"Readings","subInfoFoerdergeber":"Sponsors","themeLabel":"MAIN THEME","themeTitle":"The Benefits and Disadvantages of German Studies in Asia in the Present Day","themeShortDesc":"In Asia today—and certainly, at least, in Korea—being a Germanist is, by all appearances, a disadvantage. This is partly due to the increasing marginalization of the German language. Not only is English overwhelmingly dominant, but even as a second foreign language in schools, German is in quantitative decline. But the act of language learning itself has also lost significance: Why should one still learn German (of all languages), when everything can be translated in an instant by more-than-competent translation apps?","themeFullDesc1":"The situation is even more acute concerning German literature. Compared to digital media, the book as a medium is becoming less and less attractive, especially for the younger generations. And besides: Why should one read Goethe, Musil, or Kafka when we Asians produce our own ‘high literature,’ such as Mo Yan, the Nobel laureate for Literature in 2012, or Han Kang, the Nobel laureate in 2024—not to mention the ‘world conquest’ by popular cultural ‘K-Contents’? Consequently (at least here in Korea), departments for German language and literature are increasingly falling behind. Student placements and professorships are being reduced to expand digital and technical fields of study. Under the dominance of digital technology, German Studies has become ever more ‘untimely’ and finds itself in a crisis.","themeFullDesc2":"Nevertheless, being a Germanist in Asia does indeed have its benefits, which paradoxically relates to the very spirit of the age that marginalizes it. Namely, the era so enthusiastic about technology is itself in a crisis, which can be described by the three great ‘K’s—Krieg (War), KI (AI - Artificial Intelligence), and Klimawandel (Climate Change). To name the individual problems associated with these three great ‘K’s: from a political and social perspective, nationalism, the refugee crisis, trauma, the culture of remembrance, and questions of identity; from an economic perspective, digitalization and the techno-utopias of the transhuman, which are linked to AI; finally, from an ecological perspective, the extinction of species, sustainability, and climate change. German Studies (both within Germany and abroad) has always sought to rise to the challenges posed by the complex problems of society, as demonstrated by the main theme of the 2025 IVG (International Association for German Studies) congress in Graz: “Language and Literature in Times of Crisis – Challenges, Tasks, and Opportunities for International German Studies.” And herein lies our benefit in this age suffering from a ‘technology fever.’ For language and literature are the medium for reflection on the problems of the present. Thus, new digital technology also leads to a ‘digital turn’ in language and literature. Examples include digital literature, such as poems generated by AI or published on Twitter, or the integration of AI into language teaching. Language and literature are the site of negotiation and action for these problems, just as Climate Fiction, for example, responds to the climate crisis by configuring reality and motivating the reader to refigure it.","themeFullDesc3":"And it is precisely Asian (or international) German Studies that has its opportunity in this time of crisis. On the one hand, the triumphant advance of digital technology is felt more rapidly and extensively here than in Europe. On the other hand, Asian German Studies, standing apart from the tasks of national philology, can be more directed towards the intercultural, international, and transnational aspects of language and literature. The problems that define the present crises can only be solved through inter- or transcultural and transnational communication and cooperation.","themeFullDesc4":"Therefore, we, the Asian Germanists, would like to remain ‘untimely’ in the sense that we “act against the times, and thereby on the times, and hopefully for the benefit of a coming future,” wherein Nietzsche, as a classical philologist, saw his reason for existence.","themeBtnReadMore":"Read More","themeBtnShowLess":"Show Less","aboutTitle":"About the AGT","aboutP1":"The Asian German Studies Conference (Asiatische Germanistentagung - AGT), although not yet known by this name at the time, was founded in August 1991 when the Japanese Society for German Studies organized a symposium in Berlin for the three East Asian countries of Japan, China, and Korea on the theme 'German Literature and Language from an East Asian Perspective.'","aboutP2":"This symposium laid the foundation for an international conference of German studies scholars in and for Asia, which, according to later agreements, was to take place principally every three years, alternating between one of the three countries. Within this framework, the regional conference of the International Association of German Teachers (IDV) in Beijing in 1994 was held as the first, or de facto second, Asian German Studies Conference, followed by further conferences:","aboutConferenceList":["1997 (Seoul): German Studies in the Multimedia Age","1999 (Fukuoka): Crossing Thresholds","2002 (Beijing): New Century, New Challenges","2006 (Seoul): Cultural Studies-Oriented German Studies in Asia","2008 (Kanazawa): Transculturality: Identities in a New Light","2012 (Beijing): Interlinguality, Interculturality, Interdisciplinarity: Expanding the Borders of German Studies","2016 (Seoul): German Studies in Times of Great Change – Tradition, Identity, Orientation","2019 (Sapporo): Unity in Diversity? German Studies Between Divergence and Convergence","2024 (Qingdao): Technology · Society · Culture – Challenges and Opportunities for German Studies Today"],"aboutP3":"When the task in Berlin in 1991 was to highlight an Asian perspective, it hinted at the central problem of German studies abroad in Asia, which had to become aware of its identity and its fields of activity and fight for them. As is evident from the conference themes listed above, the subsequent conferences always dealt with topics that co-determined the most recent international developments in German studies, while at the same time taking into account our need for a reorientation in teaching and research.","aboutP4":"It is also a tradition of the Asian German Studies Conference to invite scholars from all over the world, especially from other Asian countries as well as from Germany, Austria, and Switzerland, in addition to the members of the Chinese, Korean, and Japanese professional associations.","presidentMessageTitle":"President's Message","presidentName":"Prof. Dr. KANG Chang-Uh","presidentDesc1":"Dear Colleagues,","presidentDesc2":"It is a great pleasure for me to inform you about the next Asian German Studies Conference (AGT) on behalf of the Korean Society of German Language and Literature (KGG). The conference will take place from August 23 to 26, 2027, at Incheon National University in Incheon, South Korea, under the general theme of \"Benefit and Disadvantage of German Studies in Asia for the Present.\"","presidentDesc3":"In recent decades, German Studies in Asia has been confronted with various challenges, and we, Asian Germanists, have successfully endeavored to jointly work out a way or a solution. In my opinion, the Asian German Studies Conferences have contributed greatly to this since the 1990s. Following the successes in Sapporo 2019 and Qingdao 2024, we aim to continue this long tradition this time in Korea in 2027.","presidentDesc4":"I sincerely hope that as many Germanists as possible, not only from China, Japan, and South Korea but also from all over the world, will gather in Incheon to exchange information and opinions and jointly explore new paths for German Studies in Asia in the just-begun age of Artificial Intelligence. The AGT 2027 Organizing Committee, led by Professor SHIN Jiyoung, will do its best together with the KGG to make the conference enriching and your stay in Incheon pleasant. I am already looking forward to the AGT 2027 in Incheon.","presidentTitleName":"President","presidentTitleOrg":"of the Korean Society of German Language and Literature","registerTitle":"Registration","registerType1Title":"1. Section Leaders","sectionLeaderClosedNotice":"The application period for section leaders has closed.","sectionLeaderProgramNotice":"Information about the accepted sections is available under Information - Program and Sections.","registerType1Btn":"Program and Sections","registerType2Title":"2. Speakers","registerType2Deadline":"Application Period: May - Dec 2026","registerType2Desc":"Present your research findings to an international audience.","presentationNoticeTitle":"Presentation Submission Notice","p           const setMenuState = (isOpen) => {
            mobileMenu.classList.toggle('hidden', !isOpen);
            mobileMenuButton.setAttribute('aria-expanded', String(isOpen));
          };

          mobileMenuButton.onclick = () => setMenuState(mobileMenu.classList.contains('hidden'));
          mobileMenu.querySelectorAll('a').forEach(link => {
            link.onclick = () => setMenuState(false);
          });
        }
  
        const langButtons = {
          de: [document.getElementById('lang-de-desktop'), document.getElementById('lang-de-mobile')],
          en: [document.getElementById('lang-en-desktop'), document.getElementById('lang-en-mobile')],
        };
  
        const updateLanguage = (lang) => {
          if (!content[lang]) return;
          document.documentElement.lang = lang;
          const langContent = content[lang];
  
          document.querySelectorAll('[data-lang-key]').forEach(el => {
            const key = el.getAttribute('data-lang-key');
            if (langContent[key] !== undefined) el.textContent = langContent[key];
          });
  
          document.querySelectorAll('[data-lang-key-list]').forEach(ul => {
            const key = ul.getAttribute('data-lang-key-list');
            if (langContent[key] && Array.isArray(langContent[key])) {
              ul.innerHTML = '';
              langContent[key].forEach(itemText => {
                const li = document.createElement('li');
                li.textContent = itemText;
                ul.appendChild(li);
              });
            }
          });

          document.querySelectorAll('[data-lang-team-list]').forEach(teamGrid => {
            if (!Array.isArray(langContent.teamMembers)) return;
            teamGrid.innerHTML = '';

            langContent.teamMembers.forEach(member => {
              const memberDiv = document.createElement('div');
              const name = document.createElement('p');
              const details = document.createElement('p');
              const institution = document.createElement('span');

              name.className = 'font-bold text-white';
              name.textContent = member.name;

              details.className = 'text-sm text-slate-400';
              details.textContent = member.role;

              institution.textContent = member.institution;
              details.appendChild(document.createElement('br'));
              details.appendChild(institution);

              memberDiv.append(name, details);
              teamGrid.appendChild(memberDiv);
            });
          });
  
          Object.values(langButtons).forEach(buttons => {
            if (buttons) buttons.forEach(button => button?.classList.remove('active'));
          });
          langButtons[lang]?.forEach(button => button?.classList.add('active'));
        };
  
        Object.keys(langButtons).forEach(lang => {
          langButtons[lang]?.forEach(button => {
            if (button) button.onclick = () => updateLanguage(lang);
          });
        });
  
        updateLanguage(document.documentElement.lang || 'de');
      });
    })();</script> </body> </html>
